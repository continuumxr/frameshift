# FrameShift (§6.2 rev 3, review 2 items 2 and 4): top-level drop-in for EVERY
# service. No service can call reboot() (F27: every shutdown goes through PID 1
# and the supervisor's detectors); no service can take an RT policy (F25).
# Exceptions are named units with their own reviewed drop-ins (RestrictRealtime=no,
# CapabilityBoundingSet=~CAP_SYS_NICE, LimitRTPRIO<=49).
[Service]
CapabilityBoundingSet=~CAP_SYS_BOOT
RestrictRealtime=yes
